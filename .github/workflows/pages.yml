# Publishes the website in the "sea-website 3" folder to GitHub Pages
# every time something is committed to the main branch.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload the website folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: "sea-website 3"
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
